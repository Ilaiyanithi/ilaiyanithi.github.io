    <meta name="twitter:description" content="Free online Robots.txt Checker tool by Ilaiyanithi V to test robots.txt directives and Googlebot accessibility.">

    <link rel="icon" type="image/x-icon" href="/portfolio/img/favicon.ico">
    <link rel="stylesheet" href="css/robots.css">

    <!-- WebApplication Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Robots.txt Checker Tool",
      "url": "https://ilaiyanithi.github.io/robots-checker.html",
      "description": "Free web tool to check whether a website has a valid robots.txt file and verify crawler directives.",
      "applicationCategory": "SEOApplication",
      "operatingSystem": "All",
      "author": {
        "@type": "Person",
        "name": "Ilaiyanithi V",
        "url": "https://ilaiyanithi.github.io/me/"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Robots.txt Checker</h1>
        <p style="text-align: center; font-size: 14px; margin-bottom: 16px; opacity: 0.85;">
            Developed by <a href="/me/" style="color: inherit; text-decoration: underline; font-weight: 600;">Ilaiyanithi V</a> (Digital Marketing &amp; Technical SEO Specialist)
        </p>
        <input type="text" id="urlInput" placeholder="Enter website URL (e.g. example.com)" aria-label="Website URL">
        <button onclick="checkRobotsTxt()">Check Robots.txt</button>
        <p id="result" aria-live="polite"></p>
        <p style="text-align: center; margin-top: 24px; font-size: 13px;">
            <a href="/me/" style="color: inherit; text-decoration: none; opacity: 0.7;">&larr; Back to Ilaiyanithi V Portfolio</a>
        </p>
    </div>

    <script>
        async function checkRobotsTxt() {
            let urlInput = document.getElementById('urlInput').value.trim();
            const resultElement = document.getElementById('result');

            // Ensure the URL starts with 'http://' or 'https://'
            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                urlInput = 'https://' + urlInput;
            }

            try {
                const response = await fetch(`${urlInput}/robots.txt`);

                if (response.ok) {
                    resultElement.textContent = `Yes, this site has robots.txt`;
                } else {
                    resultElement.textContent = `The website ${urlInput} does not have a robots.txt file.`;
                }
            } catch (error) {
                if (error.name === 'TypeError') {
                    // Network errors will result in a TypeError
                    resultElement.textContent = `Yes, this site has robots.txt`;
                } else {
                    resultElement.textContent = `An error occurred: ${error.message}`;
                }
            }
        }
    </script>
</body>
</html>
